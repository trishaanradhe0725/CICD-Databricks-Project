name: Deploy to Production

on:
  push:
    branches: [ main ]

concurrency: production  # Prevents concurrent production deployments

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production  # Requires approval if rules configured
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main


      - name: Deploy to production
        run: databricks bundle deploy -t prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
          REPO_PATH: /Workspace/Users/trishaanradhe0725@gmail.com/PROD-CICD-Databricks-Project
