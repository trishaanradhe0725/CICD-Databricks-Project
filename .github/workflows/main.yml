name: Deploy to Production

on:
  push:
    branches: [ main ]

concurrency: production  # Good – prevents overlapping runs

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production  # Good for approvals/secrets scoping
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle (recommended)
        run: databricks bundle validate -t prod
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_URL }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}

      - name: Deploy to production
        run: databricks bundle deploy -t prod
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_URL }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}

      # Optional: Remove REPO_PATH if not needed
      # Most users don't need to set REPO_PATH manually
