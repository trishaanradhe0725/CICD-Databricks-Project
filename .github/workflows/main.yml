name: CI

on:
  push:
    paths-ignore:
      - .github
    branches:
      - main  # Add 'dev' here if you have a separate dev branch

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development
    env:
      DATABRICKS_HOST: ${{ secrets.DEV_DATABRICKS_URL }}
      DATABRICKS_TOKEN: ${{ secrets.DEV_DATABRICKS_TOKEN }}
      REPO_PATH: /Workspace/Users/trishaanradhe0725@gmail.com/DEV-CICD-Databricks-Project

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - uses: databricks/setup-cli@main

      - name: Extract branch name
        id: extract_branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Update Databricks Dev Repo
        run: |
          databricks repos update --path "${{ env.REPO_PATH }}" --branch "${{ steps.extract_branch.outputs.branch }}"

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_URL }}
      DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
      REPO_PATH: /Workspace/Users/trishaanradhe0725@gmail.com/PROD-CICD-Databricks-Project

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - uses: databricks/setup-cli@main

      - name: Extract branch name
        id: extract_branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Update Databricks Prod Repo
        run: |
          databricks repos update --path "${{ env.REPO_PATH }}" --branch "${{ steps.extract_branch.outputs.branch }}"
