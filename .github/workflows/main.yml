name: Deploy to Production

on:
  push:
    branches: [ main ]

concurrency: production

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: .  # Explicitly set to repo root (usually default, but safe)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history (helps with git operations in bundles)

      - name: Debug - List files (to confirm databricks.yml exists)
        run: |
          echo "Current directory: $(pwd)"
          ls -la

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t prod
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_URL }}  # Fixed secret name
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}

      - name: Deploy to production
        run: databricks bundle deploy -t prod
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_URL }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
